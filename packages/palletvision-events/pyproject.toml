[project]
name = "palletvision-events"
version = "0.1.0"
description = "Zone event records, sinks (JSONL, SQLite outbox, Postgres) and the pv-sync agent."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "palletvision-zones",
  "psycopg[binary]>=3.2",
]

[project.scripts]
pv-db = "palletvision_events.db:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletvision_events"]

[tool.uv.sources]
palletvision-zones = { workspace = true }

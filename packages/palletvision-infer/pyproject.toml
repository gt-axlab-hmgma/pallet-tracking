[project]
name = "palletvision-infer"
version = "0.1.0"
description = "Video and webcam inference, detector backends and benchmarking."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "onnxruntime>=1.18",
  "torch>=2.4",
]

[project.scripts]
pv-infer = "palletvision_infer.cli:main"
pv-bench = "palletvision_infer.bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletvision_infer"]

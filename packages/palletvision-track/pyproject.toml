[project]
name = "palletvision-track"
version = "0.1.0"
description = "ByteTrack multi-object tracker (Kalman filter + IoU association). numpy and scipy, no torch."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletvision_track"]

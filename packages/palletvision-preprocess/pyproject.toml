[project]
name = "palletvision-preprocess"
version = "0.1.0"
description = "Image preprocessing shared by training and inference, so both see identical pixels."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["numpy>=1.26", "opencv-python>=4.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletvision_preprocess"]

[project]
name = "palletvision-train"
version = "0.1.0"
description = "Datasets, trainer, evaluation and ONNX export for palletvision models."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "palletvision-model",
  "palletvision-preprocess",
  "torch>=2.4",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "onnx>=1.16",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pycocotools>=2.0.8",
]

[project.scripts]
pv-train = "palletvision_train.cli:main"
pv-export = "palletvision_train.export:main"
pv-overfit = "palletvision_train.overfit_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletvision_train"]

[tool.uv.sources]
palletvision-model = { workspace = true }
palletvision-preprocess = { workspace = true }

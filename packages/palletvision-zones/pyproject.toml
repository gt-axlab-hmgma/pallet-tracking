[project]
name = "palletvision-zones"
version = "0.1.0"
description = "Zone geometry and enter/exit event engine. Plain Python, written to be ported to C++."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletvision_zones"]

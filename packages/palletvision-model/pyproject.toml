[project]
name = "palletvision-model"
version = "0.1.0"
description = "Pure PyTorch detector modules (blocks, backbone, neck, head). Imports only torch."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletvision_model"]

[project]
name = "palletvision-demo"
version = "0.1.0"
description = "Local API behind the zone-drawing demo UI: zones, mock objects and event logging."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "palletvision-zones",
  "palletvision-events",
  "palletvision-infer",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
pv-demo = "palletvision_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletvision_demo"]

[tool.uv.sources]
palletvision-zones = { workspace = true }
palletvision-events = { workspace = true }
palletvision-infer = { workspace = true }

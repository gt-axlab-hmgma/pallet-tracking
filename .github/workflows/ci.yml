name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The database tests create throwaway databases on this server (defaults match .env.example).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: palletvision
          POSTGRES_PASSWORD: palletvision
          POSTGRES_DB: palletvision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palletvision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy packages
      - name: Test
        run: uv run pytest -q
      - name: Build packages
        run: uv build --all-packages --out-dir dist

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/demo-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # next build also type-checks the app
      - name: Build
        run: npm run build

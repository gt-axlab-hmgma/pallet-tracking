# LOCO plus SORDI synthetic scenes, with a train/val/test split of both.
# LOCO is split by whole site (train 2, 3, 5; val 1; test 4) because its frames are video.
# SORDI frames are independent views, so every image is assigned to train/val/test by a hash of
# its name, 70/15/15, in every scene: adding scenes never moves an image already assigned.
defaults:
  - loco
  - _self_
name: loco_sordi
sordi:
  # scene folders (see data/README.md). A scene is either one folder with images/ and labels/json/
  # or a folder of DR-1, DR-2... levels laid out that way, and all of its levels are used.
  roots:
    - data/sordid-01
    - data/sordid-02
    - data/sordid-03
    - data/sordid-04
    - data/sordid-05
    - data/sordid-06
    - data/sordid-08
  # SORDI class names -> trained classes; the rest (dolly, forklift, boxes, ...) are dropped.
  # Same rule as LOCO: a stillage is trained as a pallet.
  class_map:
    pallet: pallet
    stillage: pallet
  fractions: [0.70, 0.15, 0.15]  # train / val / test
  val_images: 2000  # synthetic validation images scored every val_every epochs (fixed random draw)
  # Real and synthetic images are treated alike. share null: one pool, and every epoch is a uniform
  # random draw of epoch_images from it (about 1% real with all the scenes). A number (0.5): every
  # epoch is all the real images plus enough synthetic ones to make that share, as in experiment 002.
  share: null
  epoch_images: 5640  # images per epoch when share is null; null makes an epoch the whole pool
  subsample: null  # keep a fixed random N of the synthetic train images, drawn from every scene
  limit: null  # keep only the first N synthetic images (smoke runs)

name: loco
root: data/loco
# COCO-format boxes. image ids differ between files, and `file_name` is only a basename,
# so the loader must locate each image from `images[].path` minus its leading "/dataset/".
# Splits by recording site (whole sites, since frames within a site are video): sub2, sub3, sub5
# train, sub1 val, sub4 test. LOCO's own files call sub1 and sub4 both "val"; sub4 is held out here.
annotations:
  train:
    - data/loco/annotations/loco-sub2-v1-train.json
    - data/loco/annotations/loco-sub3-v1-train.json
    - data/loco/annotations/loco-sub5-v1-train.json
  val:
    - data/loco/annotations/loco-sub1-v1-val.json
  test:
    - data/loco/annotations/loco-sub4-v1-val.json
# LOCO categories: small_load_carrier, forklift, pallet, stillage, pallet_truck.
# Stage 1 keeps pallets and stillages (cargo on a pallet-like base) as the single class
# `pallet`. Pallet trucks are vehicles, not pallets, and a parked one must not raise a pallet
# event. Categories not listed here (pallet_truck, forklift, small_load_carrier) are dropped.
# Revisit stillages when HMGMA's real pallet types are known (stage 2).
class_map:
  pallet: pallet
  stillage: pallet
num_workers: 4
limit: null  # keep only the first N training images (smoke runs, overfit gate)
val_limit: null  # score only the first N validation images (smoke runs)
# Training augmentation: the YOLO26 report's values for the n model (Table S3). Real images only;
# validation is never augmented. `enabled: false` trains on plain letterboxed images.
augment:
  enabled: true
  mosaic: 1.0  # probability of building a sample from 4 images
  scale: 0.5  # random zoom between 0.5x and 1.5x
  translate: 0.1  # random shift, as a fraction of the image
  fliplr: 0.5
  hsv_h: 0.02
  hsv_s: 0.7
  hsv_v: 0.4
  close_mosaic: 8  # no mosaic in the last 8 epochs

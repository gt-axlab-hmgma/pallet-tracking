epochs: 150  # the report's pretraining recipe (Table S2)
batch_size: 16
optimizer: musgd  # musgd (YOLO26's, lr 0.01), sgd (lr 0.01) or adamw (lr 0.001)
lr: 0.01  # YOLO26 report, Table S2
weight_decay: 0.001  # at the nominal batch. The report's 0.0005 is scaled by batch 128 / 64 in Ultralytics, giving 0.001 at batch 128
momentum: 0.937  # (MuSGD and SGD) momentum, or AdamW's first beta; the report prints it rounded to 0.94
muon_weight: 0.45  # MuSGD: weight of the Muon update (YOLO26n, report Table S4)
sgd_weight: 0.55  # MuSGD: weight of the SGD update on the same weights
nominal_batch: 128  # the report's batch; 8 batches of 16 are accumulated (a real batch of 128 needs about 80 GB here)
warmup_epochs: 1  # the learning rate climbs from 0 over these epochs, at least 100 iterations (the report: 1)
warmup_bias_lr: 0.1  # sgd and musgd: biases start here and fall to the scheduled rate (0.1, our choice; the report does not give it)
lr_final: 0.01  # the rate at the last epoch, as a fraction of lr
lr_schedule: linear  # linear or cosine; the report does not say, linear is the usual choice
amp: false  # mixed precision (forward pass only; loss and optimiser stay float32). Off until validated
amp_dtype: auto  # bfloat16 | float16 | auto (cuda: bfloat16 if the GPU supports it, else float16)
max_steps: null  # set to a small int for smoke runs
output_dir: runs/stage1
init_from: null  # a checkpoint whose weights start this run (pretraining -> fine-tuning): weights only, class heads of another shape stay fresh
pretrained_lr_mult: 1.0  # with init_from: the copied tensors train at this multiple of lr (e.g. 0.2); the fresh ones at lr
alpha_schedule: epoch  # progressive-loss weight: epoch (the report's, once per epoch) or step (every step; for runs of a few epochs)
alpha_init: 0.8  # one-to-many weight at the start (the report's); a converged pretrained model can start lower, e.g. 0.3
alpha_final: 0.1
ema: false  # keep an exponential moving average of the weights: it is scored and saved as the model
ema_decay: 0.9999  # about 1 / (1 - decay) updates are averaged: 0.99 to 0.995 for a fine-tune of a thousand updates
ema_tau: 2000  # the decay ramps up over about this many updates
resume: null  # null starts fresh; a checkpoint path resumes it; "auto" resumes <output_dir>/last.pt if present
val_every: 0  # score the validation split every N epochs (and after the last); 0 never. Needs data=loco

[tool.uv.workspace]
members = ["packages/*"]

# On Windows the default PyPI torch is CPU-only, so take the CUDA 12.8 build from PyTorch's own
# index (RTX 50-series needs CUDA 12.8 or newer). Linux's PyPI torch is already a CUDA build and
# macOS uses the default one with Metal.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "onnx>=1.23.2",
  "onnxruntime>=1.30.0",
  "jsonschema>=4.26.0",
  "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/*/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-ra -m 'not slow'"
markers = ["slow: takes about a minute or more; run with `uv run pytest -m slow`"]
